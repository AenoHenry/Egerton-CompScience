<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Fee Structure</title>
</head>

<body>

    <h1>Student Fee Structure</h1>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>Fee Description</th>
                <th>Amount (KES)</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Tuition Fee</td>
                <td>35,000</td>
            </tr>

            <tr>
                <td>Registration Fee</td>
                <td>2,000</td>
            </tr>

            <tr>
                <td>Library Fee</td>
                <td>1,500</td>
            </tr>

            <tr>
                <td>Computer Fee</td>
                <td>2,500</td>
            </tr>

            <tr>
                <td>Examination Fee</td>
                <td>3,000</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th>Total Charges</th>
                <th>44,000 KES</th>
            </tr>
        </tfoot>

    </table>

</body>

</html>
